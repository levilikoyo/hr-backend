<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Approbations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- PWA -->
    <link rel="manifest" href="/mobile/manifest.json?v=android-approvals1">
    <meta name="theme-color" content="#ffffff">

    <link rel="apple-touch-icon" sizes="180x180" href="/mobile/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/mobile/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/mobile/icons/icon-512.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EMS-L Approval">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- CSS -->
    <link rel="stylesheet" href="css/mobile.css?v=android-approvals1">
    <link rel="stylesheet" href="css/dialog.css?v=android-approvals1">
    <link rel="stylesheet" href="css/approvals-android.css?v=android-approvals1">
</head>
<body>

<div class="app approvals-page">

    <!-- Top Header -->
    <div class="top-header">
        <div class="top-header-left">
            <a href="index.html?v=android-approvals1" class="return-btn" aria-label="Back" data-i18n-aria-label="common.back">
                ←
            </a>

            <div class="app-title-box">
                <h1 data-i18n="approvals.title">Approvals</h1>
                <p data-i18n="approvals.subtitle">Pending requests</p>
            </div>
        </div>

        <div class="top-header-right">
            <div class="user-info-box" id="userInfoBox">
                <div class="user-text">
                    <strong id="currentUserName" class="user-name" data-i18n="common.user">User</strong>
                    <span id="currentUserRole" class="user-role" data-i18n="common.role">ROLE</span>
                </div>
                <img src="images/user-avatar.png" alt="User" class="user-avatar">
            </div>

            <div class="user-dropdown" id="userDropdown">
                <strong id="dropdownUserName" data-i18n="common.user">User</strong>
                <span id="dropdownUserEmail">user@email.com</span>
                <small id="dropdownUserRole" data-i18n="common.role">ROLE</small>
                <div data-language-switcher></div>
                <button type="button" onclick="logout()" data-i18n="common.logout">Logout</button>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="content approval-content">

        <div class="section-header approval-section-header">
            <h2 data-i18n="approvals.pendingRequests">Pending requests</h2>
            <span class="badge pending-count" id="pendingCount">0</span>
        </div>

        <div class="loading" style="display:none;">
            <span data-i18n="approvals.loading">Loading pending approvals...</span>
        </div>

        <div id="pendingRequestsContainer" class="approval-list">
            <!-- Approval cards are rendered by approvals.js -->
        </div>

    </div>

</div>

<!-- Scripts: order is important -->
<script src="js/config.js?v=android-approvals1"></script>
<script src="js/mobile-dialog.js?v=android-approvals1"></script>
<script src="js/i18n.js?v=android-lang1"></script>
<script src="js/auth.js?v=android-approvals1"></script>
<script src="js/approvals.js?v=android-approvals1"></script>
<script src="js/pwa-register.js?v=android-approvals1"></script>

</body>
</html>
