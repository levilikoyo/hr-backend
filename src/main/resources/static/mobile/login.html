<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion mobile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA -->
    <link rel="manifest" href="/mobile/manifest.json">
    <meta name="theme-color" content="#ffffff">

    <link rel="apple-touch-icon" sizes="180x180" href="/mobile/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/mobile/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/mobile/icons/icon-512.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EMS-L Approval">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- CSS -->
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/dialog.css">
</head>
<body>

<div class="app">

    <div class="header">
        <h1>Connexion</h1>
        <p>Accès mobile approval</p>
    </div>

    <form class="form-card" id="loginForm">

        <div class="form-group">
            <label for="email">Email</label>
            <input
                    type="email"
                    id="email"
                    placeholder="Ex: user@email.com"
                    autocomplete="email"
                    required>
        </div>

        <div class="form-group">
            <label for="pinCode">PIN Code</label>
            <input
                    type="password"
                    id="pinCode"
                    placeholder="Enter your PIN"
                    inputmode="numeric"
                    autocomplete="current-password"
                    required>
        </div>

        <button type="submit" class="btn-primary">
            Se connecter
        </button>

    </form>

</div>

<script src="js/config.js"></script>
<script src="js/mobile-dialog.js"></script>
<script src="js/auth.js"></script>
<script src="js/pwa-register.js"></script>

</body>
</html>
