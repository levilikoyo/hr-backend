<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Approbations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA -->
    <link rel="manifest" href="/mobile/manifest.json">
    <meta name="theme-color" content="#ffffff">

    <link rel="apple-touch-icon" sizes="180x180" href="/mobile/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/mobile/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/mobile/icons/icon-512.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EMS-L Approval">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- CSS -->
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/dialog.css">
</head>
<body>

<div class="app">

    <!-- Header -->
    <div class="top-header">
        <button type="button" class="back-button" id="backBtn">
            ←
        </button>

        <div class="page-title">
            <h1>Approbations</h1>
            <p>Demandes en attente</p>
        </div>

        <div class="user-box">
            <div>
                <strong id="currentUserName" class="user-name">User</strong>
                <span id="currentUserRole" class="user-role">ROLE</span>
            </div>
            <img src="images/user-avatar.png" alt="User" class="user-avatar">
        </div>
    </div>

    <!-- Content -->
    <div class="content">

        <div class="section-header">
            <h2>Pending requests</h2>
            <span class="badge pending-count" id="pendingCount">0</span>
        </div>

        <div class="loading" style="display:none;">
            Loading pending approvals...
        </div>

        <div id="pendingRequestsContainer" class="approval-list">
            <!-- Approval cards will be loaded here by approvals.js -->
        </div>

    </div>

</div>

<!-- Scripts: order is very important -->
<script src="js/config.js"></script>
<script src="js/mobile-dialog.js"></script>
<script src="js/auth.js"></script>
<script src="js/approvals.js"></script>
<script src="js/pwa-register.js"></script>

</body>
</html>
