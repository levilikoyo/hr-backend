<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mobile Approval</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- PWA -->
    <link rel="manifest" href="/mobile/manifest.json?v=android-layout1">
    <meta name="theme-color" content="#ffffff">

    <link rel="apple-touch-icon" sizes="180x180" href="/mobile/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/mobile/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/mobile/icons/icon-512.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EMS-L Approval">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- CSS -->
    <link rel="stylesheet" href="css/mobile.css?v=android-layout1">
    <link rel="stylesheet" href="css/dialog.css?v=android-layout1">
</head>
<body>

<div class="app">

    <!-- TOP HEADER -->
    <div class="top-header">

        <div class="top-header-left">
            <div class="app-title-box">
                <h1 data-i18n="home.title">Mobile Approval</h1>
                <p data-i18n="home.subtitle">Needs request</p>
            </div>
        </div>

        <div class="top-header-right">

            <div class="user-info-box" onclick="toggleUserMenu()">
                <div class="user-text">
                    <strong id="currentUserName" data-i18n="common.user">User</strong>
                    <span id="currentUserRole" data-i18n="common.role">Role</span>
                </div>

                <img src="images/user-avatar.png" alt="User" class="user-avatar">
            </div>

            <div class="user-dropdown" id="userDropdown">
                <strong id="dropdownUserName" data-i18n="common.user">User</strong>
                <span id="dropdownUserEmail">email</span>
                <small id="dropdownUserRole" data-i18n="common.role">Role</small>
                <div data-language-switcher></div>

                <button type="button" onclick="logoutUser()" data-i18n="common.logout">
                    Logout
                </button>
            </div>

        </div>

    </div>

    <!-- DASHBOARD CARDS -->
    <div class="dashboard-grid">

        <div class="dashboard-card">
            <div class="dashboard-label" data-i18n="home.myPending">My pending</div>
            <div class="dashboard-value" id="myPendingCount">0</div>
        </div>

        <div class="dashboard-card">
            <div class="dashboard-label" data-i18n="home.approved">Approved</div>
            <div class="dashboard-value" id="approvedCount">0</div>
        </div>

        <div class="dashboard-card">
            <div class="dashboard-label" data-i18n="home.rejected">Rejected</div>
            <div class="dashboard-value rejected" id="rejectedCount">0</div>
        </div>

        <div class="dashboard-card" id="pendingApprovalCard">
            <div class="dashboard-label" data-i18n="home.toApprove">To approve</div>
            <div class="dashboard-value approval" id="pendingApprovalCount">0</div>
        </div>

        <div class="dashboard-card">
            <div class="dashboard-label" data-i18n="common.notifications">Notifications</div>
            <div class="dashboard-value notification" id="notificationUnreadCount">0</div>
        </div>

    </div>

    <!-- MAIN MENU -->
    <div class="menu">

        <a href="needs-request.html" class="menu-card">
            <div class="menu-icon">＋</div>

            <div class="menu-content">
                <h2 data-i18n="home.newRequest">New request</h2>
                <p data-i18n="home.newRequestDesc">Create a needs request</p>
            </div>
        </a>

        <a href="approvals.html" class="menu-card" id="approvalMenuCard">
            <div class="menu-icon">✓</div>

            <div class="menu-content">
                <h2 data-i18n="home.approvals">Approvals</h2>
                <p data-i18n="home.approvalsDesc">Approve or reject requests</p>
            </div>

            <span class="menu-badge" id="approvalMenuBadge">0</span>
        </a>

        <a href="my-requests.html" class="menu-card">
            <div class="menu-icon">📄</div>

            <div class="menu-content">
                <h2 data-i18n="home.myRequests">My requests</h2>
                <p data-i18n="home.myRequestsDesc">Track submitted requests</p>
            </div>

            <span class="menu-badge" id="myRequestsMenuBadge">0</span>
        </a>

        <a href="notifications.html" class="menu-card">
            <div class="menu-icon">🔔</div>

            <div class="menu-content">
                <h2 data-i18n="common.notifications">Notifications</h2>
                <p data-i18n="home.notificationsDesc">View alerts and updates</p>
            </div>

            <span class="menu-badge" id="notificationMenuBadge">0</span>
        </a>

    </div>

</div>

<script src="js/config.js?v=android-layout1"></script>
<script src="js/mobile-dialog.js?v=android-layout1"></script>
<script src="js/i18n.js?v=android-lang1"></script>
<script src="js/auth.js?v=android-layout1"></script>
<script src="js/home.js?v=android-layout1"></script>
<script src="js/pwa-register.js?v=android-layout1"></script>

</body>
</html>
