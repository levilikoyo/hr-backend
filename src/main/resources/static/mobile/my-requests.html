<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mes demandes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- PWA -->
    <link rel="manifest" href="/mobile/manifest.json?v=android-myrequests1">
    <meta name="theme-color" content="#ffffff">

    <link rel="apple-touch-icon" sizes="180x180" href="/mobile/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/mobile/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/mobile/icons/icon-512.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EMS-L Approval">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- CSS -->
    <link rel="stylesheet" href="css/mobile.css?v=android-myrequests1">
    <link rel="stylesheet" href="css/dialog.css?v=android-myrequests1">
    <link rel="stylesheet" href="css/my-requests-android.css?v=android-myrequests1">
</head>
<body>

<div class="app my-requests-page">

    <!-- Top Header -->
    <div class="top-header">

        <div class="top-header-left">
            <a href="index.html?v=android-myrequests1" class="return-btn" aria-label="Back" data-i18n-aria-label="common.back">
                ←
            </a>

            <div class="app-title-box">
                <h1 data-i18n="myRequests.title">My requests</h1>
                <p data-i18n="myRequests.subtitle">Request tracking</p>
            </div>
        </div>

        <div class="top-header-right">

            <div class="user-info-box" id="userInfoBox" onclick="toggleUserMenu()">
                <div class="user-text">
                    <strong id="currentUserName" class="user-name" data-i18n="common.user">User</strong>
                    <span id="currentUserRole" class="user-role" data-i18n="common.role">Role</span>
                </div>

                <img src="images/user-avatar.png" alt="User" class="user-avatar">
            </div>

            <div class="user-dropdown" id="userDropdown">
                <strong id="dropdownUserName" data-i18n="common.user">User</strong>
                <span id="dropdownUserEmail">email</span>
                <small id="dropdownUserRole" data-i18n="common.role">Role</small>
                <div data-language-switcher></div>

                <button type="button" onclick="logoutUser()" data-i18n="common.logout">
                    Logout
                </button>
            </div>

        </div>

    </div>

    <!-- Content -->
    <div class="approval-container my-requests-content">

        <div class="approval-toolbar my-requests-toolbar">
            <h2 data-i18n="myRequests.requests">Requests</h2>
            <span id="requestCount">0</span>
        </div>

        <div class="filter-tabs my-requests-filter-tabs">
            <button type="button" class="tab-btn active" onclick="filterRequests('ALL', this)">
                <span data-i18n="myRequests.all">All</span>
            </button>

            <button type="button" class="tab-btn" onclick="filterRequests('PENDING_HOD_APPROVAL', this)">
                HOD
            </button>

            <button type="button" class="tab-btn" onclick="filterRequests('PENDING_FINANCE_REVIEW', this)">
                Finance
            </button>

            <button type="button" class="tab-btn" onclick="filterRequests('PENDING_DIRECTOR_APPROVAL', this)">
                Director
            </button>

            <button type="button" class="tab-btn" onclick="filterRequests('APPROVED', this)">
                <span data-i18n="home.approved">Approved</span>
            </button>

            <button type="button" class="tab-btn" onclick="filterRequests('REJECTED', this)">
                <span data-i18n="home.rejected">Rejected</span>
            </button>
        </div>

        <div id="myRequestsList" class="my-requests-list"></div>

    </div>

</div>

<script src="js/config.js?v=android-myrequests1"></script>
<script src="js/mobile-dialog.js?v=android-myrequests1"></script>
<script src="js/i18n.js?v=android-lang1"></script>
<script src="js/auth.js?v=android-myrequests1"></script>
<script src="js/my-requests.js?v=android-myrequests1"></script>
<script src="js/pwa-register.js?v=android-myrequests1"></script>

</body>
</html>
