<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Approbations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA -->
    <link rel="manifest" href="/mobile/manifest.json?v=20260603-dialog1">
    <meta name="theme-color" content="#ffffff">

    <link rel="apple-touch-icon" sizes="180x180" href="/mobile/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/mobile/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/mobile/icons/icon-512.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EMS-L Approval">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- CSS -->
    <link rel="stylesheet" href="css/mobile.css?v=20260603-dialog1">
    <link rel="stylesheet" href="css/dialog.css?v=20260603-dialog1">
</head>
<body>

<div class="app">

    <!-- Top Header -->
    <div class="top-header">
        <div class="top-header-left">
            <a href="index.html" class="return-btn" aria-label="Back">
                ←
            </a>

            <div class="app-title-box">
                <h1>Approbations</h1>
                <p>Demandes en attente</p>
            </div>
        </div>

        <div class="top-header-right">
            <div class="user-info-box" id="userInfoBox">
                <div class="user-text">
                    <strong id="currentUserName" class="user-name">User</strong>
                    <span id="currentUserRole" class="user-role">ROLE</span>
                </div>
                <img src="images/user-avatar.png" alt="User" class="user-avatar">
            </div>

            <div class="user-dropdown" id="userDropdown">
                <strong id="dropdownUserName">User</strong>
                <span id="dropdownUserEmail">user@email.com</span>
                <small id="dropdownUserRole">ROLE</small>
                <button type="button" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="content">

        <div class="section-header">
            <h2>Pending requests</h2>
            <span class="badge pending-count" id="pendingCount">0</span>
        </div>

        <div class="loading" style="display:none;">
            Loading pending approvals...
        </div>

        <div id="pendingRequestsContainer" class="approval-list">
            <!-- Approval cards are rendered by approvals.js -->
        </div>

    </div>

</div>

<!-- Scripts: order is important -->
<script src="js/config.js?v=20260603-dialog1"></script>
<script src="js/mobile-dialog.js?v=20260603-dialog1"></script>
<script src="js/auth.js?v=20260603-dialog1"></script>
<script src="js/approvals.js?v=20260603-dialog1"></script>
<script src="js/pwa-register.js?v=20260603-dialog1"></script>

</body>
</html>
