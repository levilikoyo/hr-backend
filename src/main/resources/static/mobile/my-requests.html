<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mes demandes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/dialog.css">
</head>
<body>

<div class="app">

    <div class="header">
        <a href="index.html" class="back-link">← Retour</a>
        <h1>Mes demandes</h1>
        <p>Suivi des expressions de besoin</p>

        <div class="user-box">
            <strong id="currentUserName">User</strong>
            <span id="currentUserRole">Role</span>
        </div>
    </div>

    <div class="approval-container">

        <div class="approval-toolbar">
            <h2>Requests</h2>
            <span id="requestCount">0</span>
        </div>

        <div class="filter-tabs">
            <button type="button" class="tab-btn active" onclick="filterRequests('ALL', this)">
                All
            </button>

            <button type="button" class="tab-btn" onclick="filterRequests('PENDING_APPROVAL', this)">
                Pending
            </button>

            <button type="button" class="tab-btn" onclick="filterRequests('APPROVED', this)">
                Approved
            </button>

            <button type="button" class="tab-btn" onclick="filterRequests('REJECTED', this)">
                Rejected
            </button>
        </div>

        <div id="myRequestsList"></div>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/mobile-dialog.js"></script>
<script src="js/auth.js"></script>
<script src="js/my-requests.js"></script>

</body>
</html>
