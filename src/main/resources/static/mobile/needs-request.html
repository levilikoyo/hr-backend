<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Needs request</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- PWA -->
    <link rel="manifest" href="/mobile/manifest.json?v=android-needs1">
    <meta name="theme-color" content="#ffffff">

    <link rel="apple-touch-icon" sizes="180x180" href="/mobile/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/mobile/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/mobile/icons/icon-512.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EMS-L Approval">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- CSS -->
    <link rel="stylesheet" href="css/mobile.css?v=android-needs1">
    <link rel="stylesheet" href="css/dialog.css?v=android-needs1">
    <link rel="stylesheet" href="css/needs-request-android.css?v=android-needs1">
</head>
<body>

<div class="app needs-request-page">

    <!-- Top Header -->
    <div class="top-header">
        <div class="top-header-left">
            <a href="index.html?v=android-needs1" class="return-btn" aria-label="Back" data-i18n-aria-label="common.back">
                ←
            </a>

            <div class="app-title-box">
                <h1 data-i18n="needs.title">Needs request</h1>
                <p data-i18n="needs.subtitle">Create a new request</p>
            </div>
        </div>

        <div class="top-header-right">
            <div class="user-info-box" id="userInfoBox">
                <div class="user-text">
                    <strong id="currentUserName" class="user-name" data-i18n="common.user">User</strong>
                    <span id="currentUserRole" class="user-role" data-i18n="common.role">ROLE</span>
                </div>
                <img src="images/user-avatar.png" alt="User" class="user-avatar">
            </div>

            <div class="user-dropdown" id="userDropdown">
                <strong id="dropdownUserName" data-i18n="common.user">User</strong>
                <span id="dropdownUserEmail">user@email.com</span>
                <small id="dropdownUserRole" data-i18n="common.role">ROLE</small>
                <div data-language-switcher></div>
                <button type="button" onclick="logout()" data-i18n="common.logout">Logout</button>
            </div>
        </div>
    </div>

    <!-- Form -->
    <form class="form-card needs-request-form" id="needsRequestForm">

        <div class="form-group">
            <label for="title" data-i18n="needs.object">Need title *</label>
            <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Example: Field fuel purchase"
                    data-i18n-placeholder="needs.objectPlaceholder"
                    required>
        </div>

        <div class="form-group">
            <label for="description" data-i18n="needs.description">General description</label>
            <textarea
                    id="description"
                    name="description"
                    placeholder="Describe the general need..."
                    data-i18n-placeholder="needs.descriptionPlaceholder"></textarea>
        </div>

        <div class="row-2 needs-row-2">
            <div class="form-group">
                <label for="requestDate" data-i18n="needs.requestDate">Requested date *</label>
                <input
                        type="date"
                        id="requestDate"
                        name="requestDate"
                        required>
            </div>

            <div class="form-group">
                <label for="priority" data-i18n="needs.priority">Priority</label>
                <select id="priority" name="priority">
                    <option value="NORMAL">NORMAL</option>
                    <option value="LOW">LOW</option>
                    <option value="HIGH">HIGH</option>
                    <option value="URGENT">URGENT</option>
                </select>
            </div>
        </div>

        <div class="section-title">
            <span data-i18n="needs.departmentApproval">Department approval</span>
        </div>

        <div class="form-group">
            <label for="addressedDepartment" data-i18n="needs.addressedDepartment">Addressed Department *</label>
            <select id="addressedDepartment" name="addressedDepartment" required>
                <option value="" data-i18n="needs.loadingDepartments">Loading departments...</option>
            </select>
        </div>

        <div class="section-title">
            <span data-i18n="needs.items">Items requested</span>
        </div>

        <div id="itemsContainer" class="needs-items-container">
            <!-- Items are rendered by needs-request.js -->
        </div>

        <button type="button" class="btn-secondary" id="addItemBtn">
            <span data-i18n="needs.addItem">+ Add item</span>
        </button>

        <div class="total-box needs-total-box">
            <strong data-i18n="needs.totalAmount">Total amount:</strong>
            <span id="grandTotal">0.00</span>
        </div>

        <div class="section-title">
            <span data-i18n="needs.budgetAccounting">Budget and accounting information</span>
        </div>

        <div class="form-group">
            <label for="budgetPlan" data-i18n="needs.budgetPlan">Budget Plan</label>
            <input
                    type="text"
                    id="budgetPlan"
                    name="budgetPlan"
                    placeholder="Optional budget plan"
                    data-i18n-placeholder="needs.budgetPlanPlaceholder">
        </div>

        <div class="form-group">
            <label for="fundCode" data-i18n="needs.fund">Fund *</label>
            <select id="fundCode" name="fundCode" required>
                <option value="" data-i18n="needs.loadingFunds">Loading funds...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="currencyCode" data-i18n="needs.currency">Currency *</label>
            <select id="currencyCode" name="currencyCode" required>
                <option value="" data-i18n="needs.loadingCurrencies">Loading currencies...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="glAccountCode" data-i18n="needs.glAccount">G/L Account *</label>
            <select id="glAccountCode" name="glAccountCode" required>
                <option value="" data-i18n="needs.loadingGlAccounts">Loading G/L accounts...</option>
            </select>
        </div>

        <div class="section-title">
            <span data-i18n="needs.dimensions">Dimensions</span>
        </div>

        <div id="dynamicDimensionsContainer" class="needs-dimensions-container">
            <!-- Dynamic dimensions are rendered by needs-request.js -->
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
            <span data-i18n="needs.submit">Submit Request</span>
        </button>

        <button type="button" class="btn-secondary" id="cancelBtn">
            <span data-i18n="common.cancel">Cancel</span>
        </button>

    </form>

</div>

<script src="js/config.js?v=android-needs1"></script>
<script src="js/mobile-dialog.js?v=android-needs1"></script>
<script src="js/i18n.js?v=android-lang1"></script>
<script src="js/auth.js?v=android-needs1"></script>
<script src="js/needs-request.js?v=android-needs1"></script>
<script src="js/pwa-register.js?v=android-needs1"></script>

</body>
</html>
