<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>EMS-L Approval - Connexion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/mobile/manifest.json?v=pwa5">

    <!-- Android PWA -->
    <meta name="theme-color" content="#0f6cbd">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EMS-L Approval">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/mobile/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/mobile/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/mobile/icons/icon-512.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/mobile.css?v=pwa5">
    <link rel="stylesheet" href="css/dialog.css?v=pwa5">
</head>
<body>

<div class="app">

    <div class="header">
        <h1>Connexion</h1>
        <p>Accès mobile approval</p>
    </div>

    <form class="form-card" id="loginForm">

        <div class="form-group">
            <label for="email">Email</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Ex: user@email.com"
                    autocomplete="email"
                    required>
        </div>

        <div class="form-group">
            <label for="pinCode">PIN Code</label>
            <input
                    type="password"
                    id="pinCode"
                    name="pinCode"
                    placeholder="Enter your PIN"
                    autocomplete="current-password"
                    required>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
            Sign In
        </button>

    </form>

</div>

<!-- Scripts: order is important -->
<script src="js/config.js?v=pwa5"></script>
<script src="js/mobile-dialog.js?v=pwa5"></script>
<script src="js/auth.js?v=pwa5"></script>
<script src="js/pwa-register.js?v=pwa5"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");

        if (!form) {
            return;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const pinCode = document.getElementById("pinCode").value.trim();

            if (!email) {
                showLoginError("Please enter your email.");
                return;
            }

            if (!pinCode) {
                showLoginError("Please enter your PIN code.");
                return;
            }

            try {
                setLoginLoading(true);

                const loginResponse = await tryLogin(email, pinCode);

                if (!loginResponse || !loginResponse.user) {
                    throw new Error("Invalid login response.");
                }

                saveCurrentUser(loginResponse.user, loginResponse.token || "");

                window.location.href = "index.html";

            } catch (error) {
                console.error("Login error:", error);
                showLoginError(error.message || "Login failed.");
            } finally {
                setLoginLoading(false);
            }
        });

        async function tryLogin(email, pinCode) {
            const endpoints = [
                "/api/mobile-auth/login",
                "/api/mobile/auth/login",
                "/api/auth/mobile/login",
                "/api/mobile-users/login",
                "/api/mobile/login"
            ];

            const payloads = [
                {
                    email: email,
                    pinCode: pinCode
                },
                {
                    email: email,
                    pin: pinCode
                },
                {
                    email: email,
                    password: pinCode
                }
            ];

            let lastError = "";

            for (const endpoint of endpoints) {
                for (const payload of payloads) {
                    try {
                        const response = await fetch(BASE_URL + endpoint, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Accept": "application/json"
                            },
                            body: JSON.stringify(payload)
                        });

                        const text = await response.text();

                        if (!response.ok) {
                            lastError = text || ("HTTP " + response.status);
                            continue;
                        }

                        const data = text ? JSON.parse(text) : {};

                        return normalizeLoginResponse(data);

                    } catch (error) {
                        lastError = error.message;
                    }
                }
            }

            throw new Error(lastError || "Invalid email or PIN.");
        }

        function normalizeLoginResponse(data) {
            if (!data) {
                return null;
            }

            if (data.user) {
                return {
                    user: data.user,
                    token: data.token || data.accessToken || ""
                };
            }

            if (data.data && data.data.user) {
                return {
                    user: data.data.user,
                    token: data.data.token || data.data.accessToken || ""
                };
            }

            if (data.id || data.email || data.fullName || data.name) {
                return {
                    user: data,
                    token: data.token || data.accessToken || ""
                };
            }

            return null;
        }

        function setLoginLoading(isLoading) {
            if (!loginBtn) {
                return;
            }

            loginBtn.disabled = isLoading;
            loginBtn.textContent = isLoading ? "Signing in..." : "Sign In";
        }

        function showLoginError(message) {
            if (window.MobileDialog && typeof window.MobileDialog.error === "function") {
                window.MobileDialog.error("Login failed", message);
                return;
            }

            alert(message);
        }
    });
</script>

</body>
</html>
