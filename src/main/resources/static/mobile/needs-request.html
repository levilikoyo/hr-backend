<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Expression de besoin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="/mobile/manifest.json?v=dept1">
    <meta name="theme-color" content="#ffffff">

    <link rel="apple-touch-icon" sizes="180x180" href="/mobile/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/mobile/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/mobile/icons/icon-512.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EMS-L Approval">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="stylesheet" href="css/mobile.css?v=dept1">
    <link rel="stylesheet" href="css/dialog.css?v=dept1">
</head>
<body>

<div class="app">

    <div class="top-header">
        <div class="top-header-left">
            <a href="index.html" class="return-btn" aria-label="Back">←</a>

            <div class="app-title-box">
                <h1>Expression de besoin</h1>
                <p>Créer une nouvelle demande</p>
            </div>
        </div>

        <div class="top-header-right">
            <div class="user-info-box" id="userInfoBox">
                <div class="user-text">
                    <strong id="currentUserName" class="user-name">User</strong>
                    <span id="currentUserRole" class="user-role">ROLE</span>
                </div>
                <img src="images/user-avatar.png" alt="User" class="user-avatar">
            </div>

            <div class="user-dropdown" id="userDropdown">
                <strong id="dropdownUserName">User</strong>
                <span id="dropdownUserEmail">user@email.com</span>
                <small id="dropdownUserRole">ROLE</small>
                <button type="button" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <form class="form-card" id="needsRequestForm">

        <div class="form-group">
            <label for="title">Objet du besoin *</label>
            <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Ex: Achat carburant terrain"
                    required>
        </div>

        <div class="form-group">
            <label for="description">Description générale</label>
            <textarea
                    id="description"
                    name="description"
                    placeholder="Décrivez le besoin général..."></textarea>
        </div>

        <div class="row-2">
            <div class="form-group">
                <label for="requestDate">Date souhaitée *</label>
                <input
                        type="date"
                        id="requestDate"
                        name="requestDate"
                        required>
            </div>

            <div class="form-group">
                <label for="priority">Priorité</label>
                <select id="priority" name="priority">
                    <option value="NORMAL">NORMAL</option>
                    <option value="LOW">LOW</option>
                    <option value="HIGH">HIGH</option>
                    <option value="URGENT">URGENT</option>
                </select>
            </div>
        </div>

        <div class="section-title">
            Department approval
        </div>

        <div class="form-group">
            <label for="addressedDepartment">Addressed Department *</label>
            <select id="addressedDepartment" name="addressedDepartment" required>
                <option value="">Loading departments...</option>
            </select>
        </div>

        <div class="section-title">
            Items requested
        </div>

        <div id="itemsContainer">
            <!-- Items are rendered by needs-request.js -->
        </div>

        <button type="button" class="btn-secondary" id="addItemBtn">
            + Add item
        </button>

        <div class="total-box">
            <strong>Total amount:</strong>
            <span id="grandTotal">0.00</span>
        </div>

        <div class="section-title">
            Budget and accounting information
        </div>

        <div class="form-group">
            <label for="budgetPlan">Budget Plan</label>
            <input
                    type="text"
                    id="budgetPlan"
                    name="budgetPlan"
                    placeholder="Optional budget plan">
        </div>

        <div class="form-group">
            <label for="fundCode">Fund *</label>
            <select id="fundCode" name="fundCode" required>
                <option value="">Loading funds...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="currencyCode">Currency *</label>
            <select id="currencyCode" name="currencyCode" required>
                <option value="">Loading currencies...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="glAccountCode">G/L Account *</label>
            <select id="glAccountCode" name="glAccountCode" required>
                <option value="">Loading G/L accounts...</option>
            </select>
        </div>

        <div class="section-title">
            Dimensions
        </div>

        <div id="dynamicDimensionsContainer">
            <!-- Dynamic dimensions are rendered by needs-request.js -->
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
            Submit Request
        </button>

        <button type="button" class="btn-secondary" id="cancelBtn">
            Cancel
        </button>

    </form>

</div>

<script src="js/config.js?v=dept1"></script>
<script src="js/mobile-dialog.js?v=dept1"></script>
<script src="js/auth.js?v=dept1"></script>
<script src="js/needs-request.js?v=dept1"></script>
<script src="js/pwa-register.js?v=dept1"></script>

</body>
</html>
