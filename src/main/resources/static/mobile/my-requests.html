<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mes demandes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/dialog.css">
</head>
<body>

<div class="app">

    <!-- WHITE HEADER WITH RETURN BUTTON -->
    <div class="top-header">

        <div class="top-header-left">
            <a href="index.html" class="return-btn">←</a>

            <div class="app-title-box">
                <h1>Mes demandes</h1>
                <p>Suivi des demandes</p>
            </div>
        </div>

        <div class="top-header-right">

            <div class="user-info-box" onclick="toggleUserMenu()">
                <div class="user-text">
                    <strong id="currentUserName">User</strong>
                    <span id="currentUserRole">Role</span>
                </div>

                <img src="images/user-avatar.png" alt="User" class="user-avatar">
            </div>

            <div class="user-dropdown" id="userDropdown">
                <strong id="dropdownUserName">User</strong>
                <span id="dropdownUserEmail">email</span>
                <small id="dropdownUserRole">Role</small>

                <button type="button" onclick="logoutUser()">
                    Logout
                </button>
            </div>

        </div>

    </div>

    <div class="approval-container">

        <div class="approval-toolbar">
            <h2>Requests</h2>
            <span id="requestCount">0</span>
        </div>

        <div class="filter-tabs">
            <button type="button" class="tab-btn active" onclick="filterRequests('ALL', this)">
                All
            </button>

            <button type="button" class="tab-btn" onclick="filterRequests('PENDING_HOD_APPROVAL', this)">
                HOD
            </button>

            <button type="button" class="tab-btn" onclick="filterRequests('PENDING_FINANCE_REVIEW', this)">
                Finance
            </button>

            <button type="button" class="tab-btn" onclick="filterRequests('PENDING_DIRECTOR_APPROVAL', this)">
                Director
            </button>

            <button type="button" class="tab-btn" onclick="filterRequests('APPROVED', this)">
                Approved
            </button>

            <button type="button" class="tab-btn" onclick="filterRequests('REJECTED', this)">
                Rejected
            </button>
        </div>

        <div id="myRequestsList"></div>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/mobile-dialog.js"></script>
<script src="js/auth.js"></script>
<script src="js/my-requests.js"></script>

</body>
</html>
