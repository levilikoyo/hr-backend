
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}

cloud.aws.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region=${AWS_REGION}
cloud.aws.s3.bucket=${AWS_S3_BUCKET}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

ems.app.id=${EMS_APP_ID:com.likoyo.emsl}
ems.app.update.version=${EMS_APP_LATEST_VERSION:1.0.0}
ems.app.update.min-version=${EMS_APP_MIN_REQUIRED_VERSION:1.0.0}
ems.app.update.notes=${EMS_APP_RELEASE_NOTES:EMS-L update available.}
ems.app.update.mandatory=${EMS_APP_UPDATE_MANDATORY:false}
ems.app.update.mac.url=${EMS_APP_MAC_URL:}
ems.app.update.mac.sha256=${EMS_APP_MAC_SHA256:}
ems.app.update.windows.url=${EMS_APP_WINDOWS_URL:}
ems.app.update.windows.sha256=${EMS_APP_WINDOWS_SHA256:}
